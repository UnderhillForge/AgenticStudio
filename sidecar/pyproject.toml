[project]
name = "agentic-sidecar"
version = "0.1.0"
description = "AgenticStudio sidecar — plans and calls the model; never writes scenes."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
]

[project.scripts]
agentic-sidecar = "agentic_sidecar.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentic_sidecar"]
